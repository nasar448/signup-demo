<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <section class="auth-panel">
        <div class="auth-copy">
          <h1>Welcome</h1>
          <p>Access your account and continue your journey with us</p>

          <form id="signInForm" class="auth-form">
            <div class="field-group">
              <label for="email">Email Address</label>
              <div class="input-wrap">
                <input id="email" type="email" placeholder="Enter your email address" />
              </div>
            </div>

            <div class="field-group">
              <label for="password">Password</label>
              <div class="input-wrap password-wrap">
                <input id="password" type="password" placeholder="Enter your password" />
                <button type="button" class="toggle-password" aria-label="Show password"> 
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5c5.5 0 10 7 10 7s-4.5 7-10 7S2 12 2 12s4.5-7 10-7Zm0 2.5A4.5 4.5 0 1 1 12 16a4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="options-row">
              <label class="remember-me">
                <input type="checkbox" />
                <span>Keep me signed in</span>
              </label>
              <a href="#">Reset password</a>
            </div>

            <button type="submit" class="primary-btn">Sign In</button>
          </form>

          <div class="divider"><span>Or continue with</span></div>

          <button type="button" class="google-btn">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s12-5.373 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-2.641-.21-5.236-.611-7.743z"/>
              <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
              <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
              <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C42.022 35.026 44 30.038 44 24c0-2.641-.21-5.236-.611-7.743z"/>
            </svg>
            Continue with Google
          </button>

          <p class="signup-note">New to our platform? <a href="#">Create Account</a></p>
        </div>
      </section>

      <aside class="hero-panel">
        <div class="hero-image"></div>
        <div class="testimonials">
          <article class="testimonial">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="Sarah Chen" />
            <div>
              <p class="name">Sarah Chen</p>
              <p class="handle">@sarahdigital</p>
              <p class="quote">Amazing platform! The user experience is seamless and the features are exactly what I needed.</p>
            </div>
          </article>
        </div>
      </aside>
    </div>

    <script src="script.js"></script>
  </body>
</html>
